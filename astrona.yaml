# Course manifest for ATS021 - Security and Policy Enforcement (Certified Cloud Native Platform Engineer).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS021
  title: "CNPE: Security and Policy Enforcement"
  description: >
    Training material covering the Certified Cloud Native Platform Engineer
    (CNPE) Security and Policy Enforcement domain: least-privilege access
    with RBAC and Pod Security Admission, mutual TLS and authorization
    between workloads with Istio and Linkerd, governance with Kyverno,
    Gatekeeper and ValidatingAdmissionPolicy, API server audit logs and
    policy compliance reports, and compliance gates in a Tekton delivery
    pipeline plus admission-time image policies, SBOM evidence, vulnerability
    scanning and signature verification. Each module pairs a
    layered reader with an ungraded hands-on playground. Each section
    closes with an integration capstone.
    Targets Kubernetes 1.35, the version the CNPE exam runs.

  certification:
    name: Certified Cloud Native Platform Engineer
    code: CNPE
    provider: CNCF / Linux Foundation
    domain: Security and Policy Enforcement
    weight: 15
    competencies:
      - "Configuring Secure Service-to-Service Communication"
      - "Applying RBAC and Security Controls Across Platform Resources"
      - "Generating Audit Trails and Enforcing Policy Compliance (SBOM, Compliance Reports, and similar)"
      - "Using Policy Engines and Admission Controllers for Governance"
      - "Integrating Security Scanning and Compliance Checks into Deployment Pipelines"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

