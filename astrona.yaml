        path: sections/section-020/module-02/course-02-servers-and-authorization-policies.md
      - type: reading
        title: Summary
        path: sections/section-020/module-02/course-03-summary.md

  - id: module-030
    title: "Governance With Policy Engines And Admission Control"
    description: >
      Makes the reader able to enforce platform rules at admission time
      with the three tools the exam uses: Kyverno, Gatekeeper (OPA and
      Rego) and the built-in ValidatingAdmissionPolicy with CEL. It
      follows the mesh section because the policies here govern objects
      from every earlier section, and it comes before audit because
      policy reports are part of the compliance evidence.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-030/README.md

      - type: reading
        title: "Validate, Mutate And Generate With Kyverno"
        path: sections/section-030/module-01/course.md

      - type: reading
        title: "Enforce Constraints With Gatekeeper And Rego"
        path: sections/section-030/module-02/course.md

      - type: reading
        title: "Write ValidatingAdmissionPolicies With CEL"
        path: sections/section-030/module-03/course.md

  - id: module-040
    title: "Audit Trails And Compliance Evidence"
    description: >
      Makes the reader able to produce the evidence a platform must
      keep: who did what in the API (audit logs) and whether the cluster
      meets its policies (Kyverno policy reports and Gatekeeper audit
      results). It follows the policy section because the policy engines
      are the compliance sources.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-040/README.md

      - type: reading
        title: "Record API Activity With Audit Logging"
        path: sections/section-040/module-01/course.md

      - type: reading
        title: "Produce Compliance Reports From Policy Engines"
        path: sections/section-040/module-02/course.md

  - id: module-050
    title: "Security Checks In The Delivery Pipeline"
    description: >
      Makes the reader able to stop non-compliant workloads before and
      at the door of the cluster: a compliance check Task that gates a
      Tekton pipeline, and admission-time image policies that accept only
      trusted, pinned images. It comes last because it reuses everything
      earlier: service accounts and RBAC for the pipeline, and Kyverno and
      Gatekeeper for the checks.

    content:
