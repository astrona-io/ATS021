questions:
  - id: ats021-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose between Role and ClusterRole, and between RoleBinding and ClusterRoleBinding, for a given access requirement"
    source_readings:
      - sections/section-010/module-01/course-02-bindings-subjects-and-scope.md
    prompt: |-
      The service account `drifter` in `outpost` must read pods in `starfleet` and in no other namespace. The built-in `view` `ClusterRole` already holds the right rules. Which setup is correct?
    options:
      - id: a
        text: "A `ClusterRoleBinding` from `drifter` to `view`."
        explanation: "This option grants the right in every namespace."
      - id: b
        text: "A `RoleBinding` in `starfleet` that points at the `ClusterRole` `view`, with the subject `drifter` and `namespace: outpost` written out."
        explanation: "Correct. A `RoleBinding` gives the rules of a `ClusterRole` only in the namespace of the binding. The subject lives in another namespace, so the binding must name it. A service account subject without `namespace` defaults to the namespace of the binding, which would be `starfleet`. A `RoleBinding` cannot bind a `Role` from another namespace."
      - id: c
        text: "A `RoleBinding` in `outpost` that points at the `ClusterRole` `view`."
        explanation: "This option grants it in `outpost`."
      - id: d
        text: "A `Role` named `view` in `outpost`, bound with a `RoleBinding` in `starfleet`."
        explanation: "This is not the best answer. A `RoleBinding` gives the rules of a `ClusterRole` only in the namespace of the binding. The subject lives in another namespace, so the binding must name it. A service account subject without `namespace` defaults to the namespace of the binding, which would be `starfleet`. A `RoleBinding` cannot bind a `Role` from another namespace."
    correct_option: b
    explanation: "A `RoleBinding` gives the rules of a `ClusterRole` only in the namespace of the binding. The subject lives in another namespace, so the binding must name it. A service account subject without `namespace` defaults to the namespace of the binding, which would be `starfleet`. A `RoleBinding` cannot bind a `Role` from another namespace."

  - id: ats021-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Check any permission for another identity with kubectl auth can-i --as, including --list"
    source_readings:
      - sections/section-010/module-01/course-03-proving-and-debugging-access.md
    prompt: |-
      An engineer must list everything the service account `shuttle` may do in `starfleet`. Which command answers that?
    options:
      - id: a
        text: "`kubectl get rolebinding -n starfleet`"
        explanation: "This option lists bindings only, not the resulting rules."
      - id: b
        text: "`kubectl auth can-i --list -n starfleet`"
        explanation: "Without `--as`, the answer is about the caller's own rights."
      - id: c
        text: "`kubectl auth can-i --list -n starfleet --as=system:serviceaccount:starfleet:shuttle`"
        explanation: "Correct. `--list` prints the rules for an identity, and `--as` makes the API server answer for that identity."
      - id: d
        text: "`kubectl auth can-i create pods -n starfleet`"
        explanation: "This option checks one verb for the caller."
    correct_option: c
    explanation: "`--list` prints the rules for an identity, and `--as` makes the API server answer for that identity."

  - id: ats021-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Label a namespace to enforce, audit or warn at the baseline or restricted Pod Security Standards level"
    source_readings:
      - sections/section-010/module-02/course-01-levels-modes-and-rejections.md
    prompt: |-
      The namespace `starfleet` has the labels `pod-security.kubernetes.io/enforce=baseline`, `pod-security.kubernetes.io/warn=restricted` and `pod-security.kubernetes.io/audit=restricted`. A user creates a pod that is not privileged but runs without `capabilities.drop: ["ALL"]` and without a `seccompProfile`. What happens?
    options:
      - id: a
        text: "The API server admits the pod, `kubectl` prints a warning that names the `restricted` violations, and the audit event carries an annotation about them."
        explanation: "Correct. Only the `enforce` label rejects a pod. The `warn` mode prints a warning to the user, and the `audit` mode adds an annotation to the audit event. Both admit the pod. The pod passes the enforced level `baseline`, so the API server stores it."
      - id: b
        text: "The API server rejects the pod, because `restricted` is the strictest label."
        explanation: "This is not the best answer. Only the `enforce` label rejects a pod. The `warn` mode prints a warning to the user, and the `audit` mode adds an annotation to the audit event. Both admit the pod. The pod passes the enforced level `baseline`, so the API server stores it."
      - id: c
        text: "The API server admits the pod without any message, because it passes `baseline`."
        explanation: "This is not the best answer. Only the `enforce` label rejects a pod. The `warn` mode prints a warning to the user, and the `audit` mode adds an annotation to the audit event. Both admit the pod. The pod passes the enforced level `baseline`, so the API server stores it."
      - id: d
        text: "The kubelet starts the pod and then stops it."
        explanation: "This is not the best answer. Only the `enforce` label rejects a pod. The `warn` mode prints a warning to the user, and the `audit` mode adds an annotation to the audit event. Both admit the pod. The pod passes the enforced level `baseline`, so the API server stores it."
    correct_option: a
    explanation: "Only the `enforce` label rejects a pod. The `warn` mode prints a warning to the user, and the `audit` mode adds an annotation to the audit event. Both admit the pod. The pod passes the enforced level `baseline`, so the API server stores it."

  - id: ats021-final-q04
    type: single_choice
    difficulty: advanced
    learning_objective: "Write a securityContext (runAsNonRoot, allowPrivilegeEscalation, capabilities drop ALL, seccompProfile RuntimeDefault) that passes restricted"
    source_readings:
      - sections/section-010/module-02/course-03-securitycontext-for-restricted.md
    prompt: |-
      In a namespace that enforces `restricted`, the `scout` pod must be admitted and must also start. Its image `podinfo` declares its user by the name `app` (ID `100`). Which `securityContext` achieves both?
    options:
      - id: a
        text: "`runAsNonRoot: true` and `allowPrivilegeEscalation: false` only."
        explanation: "This option leave out fields that `restricted` requires, so admission rejects the pod."
      - id: b
        text: "`privileged: false` and `readOnlyRootFilesystem: true`."
        explanation: "This option leave out fields that `restricted` requires, so admission rejects the pod."
      - id: c
        text: "`runAsNonRoot: true`, `allowPrivilegeEscalation: false`, `capabilities.drop: [\"ALL\"]` and `seccompProfile.type: RuntimeDefault`, with no `runAsUser`."
        explanation: "This option passes admission, but the kubelet cannot prove that the non-numeric user `app` is not root."
      - id: d
        text: "The settings of option C, plus `runAsUser: 100`."
        explanation: "Correct. The pod then shows `CreateContainerConfigError`. A numeric `runAsUser` removes the doubt."
    correct_option: d
    explanation: "The pod then shows `CreateContainerConfigError`. A numeric `runAsUser` removes the doubt."

  - id: ats021-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find and remove an over-broad binding such as cluster-admin given to a workload service account"
    source_readings:
      - sections/section-010/module-01/course-04-over-broad-grants-and-aggregation.md
    prompt: |-
      An audit removes the `ClusterRoleBinding` that gave `cluster-admin` to the service account `legacy-agent` in `starfleet`. Afterwards `kubectl auth can-i create pods -n starfleet --as=system:serviceaccount:starfleet:legacy-agent` still answers `yes`. What is the correct next step?
    options:
      - id: a
        text: "Wait one hour for the API server to refresh its cache."
        explanation: "This is not the best answer. A grant can come from either kind of binding, so a complete search covers both in all namespaces. The API server answers `can-i` from the current bindings, and no cache delay of an hour exists. Editing a built-in role breaks other subjects, and the API server resets it."
      - id: b
        text: "Edit the `cluster-admin` `ClusterRole` and remove its rules."
        explanation: "This is not the best answer. A grant can come from either kind of binding, so a complete search covers both in all namespaces. The API server answers `can-i` from the current bindings, and no cache delay of an hour exists. Editing a built-in role breaks other subjects, and the API server resets it."
      - id: c
        text: "Add `--as-group=system:masters` to the check."
        explanation: "This is not the best answer. A grant can come from either kind of binding, so a complete search covers both in all namespaces. The API server answers `can-i` from the current bindings, and no cache delay of an hour exists. Editing a built-in role breaks other subjects, and the API server resets it."
      - id: d
        text: "Search the `RoleBindings` and `ClusterRoleBindings` in all namespaces for this subject. A `RoleBinding` in `starfleet` to `admin` or `cluster-admin` also gives full rights there. Delete it and run the check again."
        explanation: "Correct. A grant can come from either kind of binding, so a complete search covers both in all namespaces. The API server answers `can-i` from the current bindings, and no cache delay of an hour exists. Editing a built-in role breaks other subjects, and the API server resets it."
    correct_option: d
    explanation: "A grant can come from either kind of binding, so a complete search covers both in all namespaces. The API server answers `can-i` from the current bindings, and no cache delay of an hour exists. Editing a built-in role breaks other subjects, and the API server resets it."

  - id: ats021-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a Deployment is accepted while its pods are rejected, and find the error in the ReplicaSet events"
    source_readings:
      - sections/section-010/module-02/course-02-changing-a-namespace-level.md
    prompt: |-
      A user applies the Deployment `bad-pod` in a namespace that enforces `restricted`. `kubectl apply` prints `deployment.apps/bad-pod created`, but `kubectl get deploy bad-pod` shows `0/1` and no pods appear. Where is the Pod Security Admission error?
    options:
      - id: a
        text: "In the output of `kubectl logs deploy/bad-pod`."
        explanation: "This is not the best answer. Pod Security Admission checks pods, not Deployments. The API server stores the Deployment. The controller then fails to create the pod, and the rejection becomes an event on the ReplicaSet. `kubectl describe replicaset` or `kubectl get events` shows it. No pod exists, so there are no logs."
      - id: b
        text: "In the output of `kubectl apply`, shown after a delay."
        explanation: "This is not the best answer. Pod Security Admission checks pods, not Deployments. The API server stores the Deployment. The controller then fails to create the pod, and the rejection becomes an event on the ReplicaSet. `kubectl describe replicaset` or `kubectl get events` shows it. No pod exists, so there are no logs."
      - id: c
        text: "In the `FailedCreate` events of the ReplicaSet. The ReplicaSet controller sent the pod create request, and Pod Security Admission rejected it."
        explanation: "Correct. Pod Security Admission checks pods, not Deployments. The API server stores the Deployment. The controller then fails to create the pod, and the rejection becomes an event on the ReplicaSet. `kubectl describe replicaset` or `kubectl get events` shows it. No pod exists, so there are no logs."
      - id: d
        text: "In the labels of the namespace."
        explanation: "This is not the best answer. Pod Security Admission checks pods, not Deployments. The API server stores the Deployment. The controller then fails to create the pod, and the rejection becomes an event on the ReplicaSet. `kubectl describe replicaset` or `kubectl get events` shows it. No pod exists, so there are no logs."
    correct_option: c
    explanation: "Pod Security Admission checks pods, not Deployments. The API server stores the Deployment. The controller then fails to create the pod, and the rejection becomes an event on the ReplicaSet. `kubectl describe replicaset` or `kubectl get events` shows it. No pod exists, so there are no logs."

  - id: ats021-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Switch a namespace from PERMISSIVE to STRICT mTLS with PeerAuthentication and prove plain-text traffic is refused"
    source_readings:
      - sections/section-020/module-01/course-02-requiring-strict-mtls.md
    prompt: |-
      In `starfleet`, the `PeerAuthentication` mode is `PERMISSIVE`. The pod `drifter` in `outpost` has no sidecar and gets `200` from `scout`. The team applies a `PeerAuthentication` named `default` in `starfleet` with `mtls.mode: STRICT`. What do `drifter` and `shuttle` (which has a sidecar) get afterwards?
    options:
      - id: a
        text: "`drifter` gets a reset connection (`curl` exit code `56`). `shuttle` still gets `200`."
        explanation: "Correct. The sidecar of `scout` expects a TLS handshake in STRICT mode and closes a plain-text connection, so no HTTP status exists. A `403` appears only after the request is read and an `AuthorizationPolicy` refuses it. `shuttle` has a sidecar, so its connection uses mutual TLS (mTLS) and succeeds."
      - id: b
        text: "`drifter` gets `403` with `RBAC: access denied`. `shuttle` still gets `200`."
        explanation: "This is not the best answer. The sidecar of `scout` expects a TLS handshake in STRICT mode and closes a plain-text connection, so no HTTP status exists. A `403` appears only after the request is read and an `AuthorizationPolicy` refuses it. `shuttle` has a sidecar, so its connection uses mutual TLS (mTLS) and succeeds."
      - id: c
        text: "Both get a reset connection."
        explanation: "This is not the best answer. The sidecar of `scout` expects a TLS handshake in STRICT mode and closes a plain-text connection, so no HTTP status exists. A `403` appears only after the request is read and an `AuthorizationPolicy` refuses it. `shuttle` has a sidecar, so its connection uses mutual TLS (mTLS) and succeeds."
      - id: d
        text: "`drifter` still gets `200`. `shuttle` gets `403`."
        explanation: "This is not the best answer. The sidecar of `scout` expects a TLS handshake in STRICT mode and closes a plain-text connection, so no HTTP status exists. A `403` appears only after the request is read and an `AuthorizationPolicy` refuses it. `shuttle` has a sidecar, so its connection uses mutual TLS (mTLS) and succeeds."
    correct_option: a
    explanation: "The sidecar of `scout` expects a TLS handshake in STRICT mode and closes a plain-text connection, so no HTTP status exists. A `403` appears only after the request is read and an `AuthorizationPolicy` refuses it. `shuttle` has a sidecar, so its connection uses mutual TLS (mTLS) and succeeds."

  - id: ats021-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a 403 RBAC access denied response and name the policy and rule that decided it"
    source_readings:
      - sections/section-020/module-01/course-03-authorizing-callers.md
    prompt: |-
      `shuttle` sends `GET /` to `scout` over mTLS and receives `403` with the body `RBAC: access denied`. Which statement is correct?
    options:
      - id: a
        text: "The Kubernetes API server refused the request. Check the result with `kubectl auth can-i`."
        explanation: "This is not the best answer. The text `RBAC: access denied` comes from Envoy in the receiving sidecar. It does not mean that Kubernetes RBAC refused anything. `istiod` sends the configuration to the sidecars but does not handle requests."
      - id: b
        text: "The Envoy sidecar of `scout` enforced an Istio `AuthorizationPolicy`. Run `istioctl x authz check deploy/scout -n starfleet` to list the policies that apply."
        explanation: "Correct. The text `RBAC: access denied` comes from Envoy in the receiving sidecar. It does not mean that Kubernetes RBAC refused anything. `istiod` sends the configuration to the sidecars but does not handle requests."
      - id: c
        text: "`istiod` rejected the request before it reached `scout`."
        explanation: "This is not the best answer. The text `RBAC: access denied` comes from Envoy in the receiving sidecar. It does not mean that Kubernetes RBAC refused anything. `istiod` sends the configuration to the sidecars but does not handle requests."
      - id: d
        text: "The `podinfo` application returned the error."
        explanation: "This is not the best answer. The text `RBAC: access denied` comes from Envoy in the receiving sidecar. It does not mean that Kubernetes RBAC refused anything. `istiod` sends the configuration to the sidecars but does not handle requests."
    correct_option: b
    explanation: "The text `RBAC: access denied` comes from Envoy in the receiving sidecar. It does not mean that Kubernetes RBAC refused anything. `istiod` sends the configuration to the sidecars but does not handle requests."

  - id: ats021-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order ALLOW, DENY and CUSTOM policies and predict the result when several match"
    source_readings:
      - sections/section-020/module-01/course-03-authorizing-callers.md
    prompt: |-
      `scout` has two `AuthorizationPolicy` objects. An `ALLOW` policy allows every method from the principal `cluster.local/ns/starfleet/sa/shuttle`. A `DENY` policy refuses the method `DELETE` for all callers. `shuttle` sends `DELETE /`. What is the result?
    options:
      - id: a
        text: "`200`, because the `ALLOW` policy matches the principal."
        explanation: "This is not the best answer. The order is `CUSTOM`, then `DENY`, then `ALLOW`. A matching `DENY` policy refuses the request before any `ALLOW` policy is read."
      - id: b
        text: "A reset connection, because the policies conflict."
        explanation: "This is not the best answer. The order is `CUSTOM`, then `DENY`, then `ALLOW`. A matching `DENY` policy refuses the request before any `ALLOW` policy is read."
      - id: c
        text: "`405`, because `DELETE` is not a method of the application."
        explanation: "This is not the best answer. The order is `CUSTOM`, then `DENY`, then `ALLOW`. A matching `DENY` policy refuses the request before any `ALLOW` policy is read."
      - id: d
        text: "`403`, because the sidecar checks `DENY` policies before `ALLOW` policies, and a matching `DENY` always wins."
        explanation: "Correct. The order is `CUSTOM`, then `DENY`, then `ALLOW`. A matching `DENY` policy refuses the request before any `ALLOW` policy is read."
    correct_option: d
    explanation: "The order is `CUSTOM`, then `DENY`, then `ALLOW`. A matching `DENY` policy refuses the request before any `ALLOW` policy is read."

  - id: ats021-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a Server and an AuthorizationPolicy with a MeshTLSAuthentication that let only shuttle call scout"
    source_readings:
      - sections/section-020/module-02/course-02-servers-and-authorization-policies.md
    prompt: |-
      In a Linkerd mesh, a team applies a `Server` for the port of `scout`, a `MeshTLSAuthentication` that names the `shuttle` service account, and an `AuthorizationPolicy` that targets the `Server` and requires that authentication. What do `shuttle` and `drifter` (no proxy) get from `scout`?
    options:
      - id: a
        text: "`200` for both, because the default inbound policy still applies."
        explanation: "This is not the best answer. The `Server` selects the port, the `MeshTLSAuthentication` names the allowed identity, and the `AuthorizationPolicy` connects the two. The proxy reads the request, finds no mesh identity for `drifter` and answers `403` with an empty body. Unlike Istio STRICT mode, Linkerd answers the request and does not reset the connection."
      - id: b
        text: "`200` for `shuttle`. `drifter` gets a reset connection."
        explanation: "This is not the best answer. The `Server` selects the port, the `MeshTLSAuthentication` names the allowed identity, and the `AuthorizationPolicy` connects the two. The proxy reads the request, finds no mesh identity for `drifter` and answers `403` with an empty body. Unlike Istio STRICT mode, Linkerd answers the request and does not reset the connection."
      - id: c
        text: "`200` for `shuttle`. `drifter` gets `403` with an empty body."
        explanation: "Correct. The `Server` selects the port, the `MeshTLSAuthentication` names the allowed identity, and the `AuthorizationPolicy` connects the two. The proxy reads the request, finds no mesh identity for `drifter` and answers `403` with an empty body. Unlike Istio STRICT mode, Linkerd answers the request and does not reset the connection."
      - id: d
        text: "`403` for both, because a `Server` always closes the port."
        explanation: "This is not the best answer. The `Server` selects the port, the `MeshTLSAuthentication` names the allowed identity, and the `AuthorizationPolicy` connects the two. The proxy reads the request, finds no mesh identity for `drifter` and answers `403` with an empty body. Unlike Istio STRICT mode, Linkerd answers the request and does not reset the connection."
    correct_option: c
    explanation: "The `Server` selects the port, the `MeshTLSAuthentication` names the allowed identity, and the `AuthorizationPolicy` connects the two. The proxy reads the request, finds no mesh identity for `drifter` and answers `403` with an empty body. Unlike Istio STRICT mode, Linkerd answers the request and does not reset the connection."

  - id: ats021-final-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Set a default inbound policy (all-unauthenticated, all-authenticated, deny) and predict who is refused"
    source_readings:
      - sections/section-020/module-02/course-01-automatic-mtls-identity-and-default-policy.md
    prompt: |-
      A team moves a namespace from Istio to Linkerd. Under Istio, STRICT mode refused callers without a sidecar. Which Linkerd setting does the same job for a whole namespace, and when does it take effect?
    options:
      - id: a
        text: "A `PeerAuthentication` with `mode: STRICT`. It takes effect at once."
        explanation: "This is not the best answer. Linkerd has no mTLS switch resource. Meshed pods use mTLS with each other from the start, and the default inbound policy sets who may connect. The proxy reads the annotation only when it starts. Injection alone does not refuse plain-text callers."
      - id: b
        text: "The namespace annotation `config.linkerd.io/default-inbound-policy=all-authenticated`. It takes effect after the workloads restart."
        explanation: "Correct. Linkerd has no mTLS switch resource. Meshed pods use mTLS with each other from the start, and the default inbound policy sets who may connect. The proxy reads the annotation only when it starts. Injection alone does not refuse plain-text callers."
      - id: c
        text: "A `MeshTLSAuthentication` with `mode: STRICT`. It takes effect at once."
        explanation: "This is not the best answer. Linkerd has no mTLS switch resource. Meshed pods use mTLS with each other from the start, and the default inbound policy sets who may connect. The proxy reads the annotation only when it starts. Injection alone does not refuse plain-text callers."
      - id: d
        text: "Injecting the proxy into the pods. Plain-text callers are refused from then on."
        explanation: "This is not the best answer. Linkerd has no mTLS switch resource. Meshed pods use mTLS with each other from the start, and the default inbound policy sets who may connect. The proxy reads the annotation only when it starts. Injection alone does not refuse plain-text callers."
    correct_option: b
    explanation: "Linkerd has no mTLS switch resource. Meshed pods use mTLS with each other from the start, and the default inbound policy sets who may connect. The proxy reads the annotation only when it starts. Injection alone does not refuse plain-text callers."

  - id: ats021-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the workload whose sidecar is missing and so breaks STRICT mTLS"
    source_readings:
      - sections/section-020/module-01/course-02-requiring-strict-mtls.md
    prompt: |-
      After STRICT mode is on in `starfleet`, the new Deployment `beacon` (service account `shuttle`) cannot reach `scout`, while `shuttle` itself works. What is the first check?
    options:
      - id: a
        text: "Whether the pod of `beacon` has the `istio-proxy` container. Its pod template may carry `sidecar.istio.io/inject: \"false\"`, and `istioctl x check-inject` names the reason."
        explanation: "Correct. A service account becomes a mesh identity only through the sidecar certificate. Without the sidecar, `beacon` has no certificate and plain text is refused. Kubernetes RBAC is not part of mesh traffic."
      - id: b
        text: "Whether the service account `shuttle` has a `RoleBinding`."
        explanation: "This is not the best answer. A service account becomes a mesh identity only through the sidecar certificate. Without the sidecar, `beacon` has no certificate and plain text is refused. Kubernetes RBAC is not part of mesh traffic."
      - id: c
        text: "Whether `scout` has an `AuthorizationPolicy` of the action `CUSTOM`."
        explanation: "This is not the best answer. A service account becomes a mesh identity only through the sidecar certificate. Without the sidecar, `beacon` has no certificate and plain text is refused. Kubernetes RBAC is not part of mesh traffic."
      - id: d
        text: "Whether the cluster trust domain is `cluster.local`."
        explanation: "This is not the best answer. A service account becomes a mesh identity only through the sidecar certificate. Without the sidecar, `beacon` has no certificate and plain text is refused. Kubernetes RBAC is not part of mesh traffic."
    correct_option: a
    explanation: "A service account becomes a mesh identity only through the sidecar certificate. Without the sidecar, `beacon` has no certificate and plain text is refused. Kubernetes RBAC is not part of mesh traffic."

  - id: ats021-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Switch a policy between Enforce and Audit and read the effect in a PolicyReport"
    source_readings:
      - sections/section-030/module-01/course-02-enforce-audit-and-policy-reports.md
    prompt: |-
      The Kyverno `ClusterPolicy` `require-limits` runs with `failureAction: Audit`, and the `PolicyReport` shows that `probe` fails it. An administrator changes the policy to `Enforce`. What happens?
    options:
      - id: a
        text: "Kyverno deletes the running pods of `probe` at once."
        explanation: "This is not the best answer. Admission decides on a request at the moment it arrives. It does not remove objects that are already stored. The Deployment can still be restarted, and the ReplicaSet controller's request for a new pod meets the Kyverno webhook. The usual order is Audit first and Enforce after the reports are clean."
      - id: b
        text: "Nothing changes until the policy is deleted and applied again."
        explanation: "This is not the best answer. Admission decides on a request at the moment it arrives. It does not remove objects that are already stored. The Deployment can still be restarted, and the ReplicaSet controller's request for a new pod meets the Kyverno webhook. The usual order is Audit first and Enforce after the reports are clean."
      - id: c
        text: "The running pods keep running. A new pod for `probe`, for example after a restart, is refused, and the error appears as a `FailedCreate` event on the ReplicaSet."
        explanation: "Correct. Admission decides on a request at the moment it arrives. It does not remove objects that are already stored. The Deployment can still be restarted, and the ReplicaSet controller's request for a new pod meets the Kyverno webhook. The usual order is Audit first and Enforce after the reports are clean."
      - id: d
        text: "The API server marks the existing Deployment as invalid."
