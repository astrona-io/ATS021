  - id: ats021-final-q28
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a tag can point at different content over time and a digest cannot"
    source_readings:
      - sections/section-050/module-02/course-01-read-an-image-reference.md
    prompt: |-
      In `starfleet-prod`, a Kyverno rule with the pattern `*@sha256:*` rejects `ghcr.io/stefanprodan/podinfo:6.15.0` but accepts the same image with a digest. Why does a pinned tag fail this rule, and what does the digest still not prove?
    options:
      - id: a
        text: "A tag is a hash of the image, but the rule needs a name."
        explanation: "This is not the best answer. The API server sees only the image string, so a rule can check the registry, the tag and the digest. It cannot check what is inside the image. The rule applies through the namespace label `environment: production`."
      - id: b
        text: "A tag is a name that the repository owner can move to other content. A digest is the hash of the image manifest and always points at the same content. It does not prove that the content is safe."
        explanation: "Correct. The API server sees only the image string, so a rule can check the registry, the tag and the digest. It cannot check what is inside the image. The rule applies through the namespace label `environment: production`."
      - id: c
        text: "Kyverno cannot read tags."
        explanation: "This is not the best answer. The API server sees only the image string, so a rule can check the registry, the tag and the digest. It cannot check what is inside the image. The rule applies through the namespace label `environment: production`."
      - id: d
        text: "A digest proves that the image has no known vulnerabilities."
        explanation: "This is not the best answer. The API server sees only the image string, so a rule can check the registry, the tag and the digest. It cannot check what is inside the image. The rule applies through the namespace label `environment: production`."
    correct_option: b
    explanation: "The API server sees only the image string, so a rule can check the registry, the tag and the digest. It cannot check what is inside the image. The rule applies through the namespace label `environment: production`."

