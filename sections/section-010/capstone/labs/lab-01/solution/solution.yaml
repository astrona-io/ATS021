# Reference solution for the section 010 capstone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-manager
  namespace: orbit
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-workload-manager
  namespace: orbit
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: orbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: orbit
  labels:
    pod-security.kubernetes.io/enforce: restricted
