# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-cluster
    description: Create the workloads and the faulty access setup
    type: file
    source: bootstrap/01-seed-cluster.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: apply-solution
    description: Apply the reference solution for this task
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: ci-deployer-can-manage-deployments
    description: ci-deployer can read, create and change Deployments in starfleet
    type: file
    source: validation/validate-ci-deployer-can-manage-deployments.sh
    hint: Create a Role in starfleet with apiGroup apps, resource deployments and the verbs get, list,
      watch, create, update, patch, then a RoleBinding to the service account.
  - name: ci-deployer-least-privilege
    description: ci-deployer has no other rights
    type: file
    source: validation/validate-ci-deployer-least-privilege.sh
    hint: Use a Role and a RoleBinding in starfleet. Do not bind cluster-admin, admin or edit, and do
      not use a wildcard.
teardown:
  keepCluster: false
