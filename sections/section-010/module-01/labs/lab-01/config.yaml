# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Grant Least-Privilege Access With RBAC (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, a ci-deployer service account with
# no rights, a legacy-agent service account bound to cluster-admin, and a
# developers-view RoleBinding. The faults are left in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the faulty access setup
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-aggregation
      description: Wait until the view role has the lease rule
      type: file
      source: testing/wait-for-aggregation.sh

validation:
  scripts:
    - name: ci-deployer-can-manage-deployments
      description: ci-deployer can read, create and change Deployments in starfleet
      type: file
      source: validation/validate-ci-deployer-can-manage-deployments.sh
      hint: Create a Role in starfleet with apiGroup apps, resource deployments and the verbs get, list, watch, create, update, patch, then a RoleBinding to the service account.
    - name: ci-deployer-least-privilege
      description: ci-deployer has no other rights
      type: file
      source: validation/validate-ci-deployer-least-privilege.sh
      hint: Use a Role and a RoleBinding in starfleet. Do not bind cluster-admin, admin or edit, and do not use a wildcard.
    - name: legacy-agent-cluster-admin-removed
      description: legacy-agent is not bound to cluster-admin
      type: file
      source: validation/validate-legacy-agent-cluster-admin-removed.sh
      hint: Find the ClusterRoleBinding that names legacy-agent and delete it. Keep the service account.
    - name: legacy-agent-reads-pods-only
      description: legacy-agent reads pods in starfleet and nothing else
      type: file
      source: validation/validate-legacy-agent-reads-pods-only.sh
      hint: Give legacy-agent a Role with get, list and watch on pods in starfleet, bound by a RoleBinding.
    - name: developers-can-list-leases
      description: The developers group can list Leases in starfleet
      type: file
      source: validation/validate-developers-can-list-leases.sh
      hint: Leases are in the coordination.k8s.io API group. The group already has the view role in starfleet.
    - name: view-extended-by-aggregation
      description: The lease right comes from an aggregated ClusterRole
      type: file
      source: validation/validate-view-extended-by-aggregation.sh
      hint: Create a small ClusterRole with the label rbac.authorization.k8s.io/aggregate-to-view set to true. Do not edit view.

teardown:
  keepCluster: false
