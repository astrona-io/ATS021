metadata:
  name: legacy-agent
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: legacy-agent-admin
subjects:
- kind: ServiceAccount
  name: legacy-agent
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
