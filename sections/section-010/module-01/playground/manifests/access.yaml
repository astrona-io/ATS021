# Access control starting state for the RBAC playground.
# - ci-deployer: a service account with no permissions yet; the reader grants them.
# - legacy-agent: a service account bound to cluster-admin. This over-broad
#   grant is deliberate: finding and removing it is part of the module.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legacy-agent
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: legacy-agent-admin
subjects:
  - kind: ServiceAccount
    name: legacy-agent
    namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
