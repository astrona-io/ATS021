# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Restrict Pods With Pod Security Admission (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads with no securityContext, a
# privileged-debug Deployment, and no Pod Security labels on starfleet.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the privileged debug Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: restricted-enforced-on-starfleet
      description: starfleet enforces the restricted level
      type: file
      source: validation/validate-restricted-enforced.sh
      hint: Label the namespace pod-security.kubernetes.io/enforce=restricted. Do not use baseline or privileged.
    - name: privileged-pod-rejected
      description: A privileged pod is rejected and a restricted pod is accepted
      type: file
      source: validation/validate-privileged-pod-rejected.sh
      hint: The API server must refuse the privileged pod with a PodSecurity message, while a pod with the four restricted settings is admitted.
    - name: privileged-debug-removed
      description: The privileged-debug Deployment is gone
      type: file
      source: validation/validate-privileged-debug-removed.sh
      hint: Delete the privileged-debug Deployment. Its pod cannot be made to pass restricted.
    - name: workloads-comply-and-run
      description: scout, probe and shuttle comply with restricted and are running
      type: file
      source: validation/validate-workloads-comply.sh
      hint: Add runAsNonRoot, runAsUser, seccompProfile RuntimeDefault, allowPrivilegeEscalation false and capabilities drop ALL. Images with a named user need a numeric runAsUser.
    - name: scout-still-serves
      description: scout answers requests from shuttle
      type: file
      source: validation/validate-scout-serves.sh
      hint: Check that the new scout pod is Running and Ready, not stuck in CreateContainerConfigError.

teardown:
  keepCluster: false
