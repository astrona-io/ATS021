# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-010-02-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - mccutchen/go-httpbin:2.25.0
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-cluster
    description: Create the independent starting state
    type: file
    source: bootstrap/01-seed-cluster.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: apply-solution
    description: Apply the reference solution for this task
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: task-behavior
    description: Stage Restricted Pod Security With Warnings
    type: file
    source: validation/validate-task.sh
teardown:
  keepCluster: false
