# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-010-02-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - curlimages/curl:8.22.0
bootstrap:
  init:
  - name: seed-cluster
    description: Create the independent starting state
    type: file
    source: bootstrap/01-seed-cluster.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: apply-solution
    description: Apply the reference solution for this task
    type: file
    source: solution/apply.sh
  - name: reject-incomplete-answers
    description: Check wrong findings and policy bypasses, then restore the solution
    type: file
    source: testing/check-failure-cases.sh
validation:
  scripts:
  - name: warnings
    description: All three namespaces admit requests with baseline warnings
    type: file
    source: validation/validate-warnings.sh
  - name: finding
    description: Only the namespace with the baseline violation is flagged
    type: file
    source: validation/validate-finding.sh
  - name: workloads
    description: The original namespaces and running Pods are preserved
    type: file
    source: validation/validate-workloads.sh
teardown:
  keepCluster: false
