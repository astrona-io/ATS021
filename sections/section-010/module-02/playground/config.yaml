# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Restrict Pods With Pod Security Admission (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies the Starfleet workloads and a privileged
# debug Deployment, then stays running for free exploration. No task,
# no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-playground-010-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# What the learner starts with: the Starfleet workloads with no
# securityContext in `starfleet` (no Pod Security labels), a privileged
# `privileged-debug` Deployment there (on purpose), and `outpost` labelled
# to enforce the baseline level for comparison.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
    - name: privileged-debug
      type: file
      source: manifests/privileged-debug.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost
    - resource: deploy/privileged-debug
      namespace: starfleet

teardown:
  keepCluster: false
