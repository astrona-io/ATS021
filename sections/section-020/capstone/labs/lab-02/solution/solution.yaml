# One Server for both versions of scout, the repaired authentication and the 75/25 route.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: scout-http
  namespace: starfleet
spec:
  podSelector:
    matchLabels:
      app: scout
  port: http
  proxyProtocol: HTTP/1
  accessPolicy: deny
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: scout-callers
  namespace: starfleet
spec:
  identityRefs:
  - kind: ServiceAccount
    name: shuttle
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scout-split
  namespace: starfleet
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: scout
    port: 80
  rules:
  - backendRefs:
    - name: scout-v1
      port: 80
      weight: 75
    - name: scout-v2
      port: 80
      weight: 25
