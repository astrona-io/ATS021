apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: scout-v1-http
  namespace: starfleet
spec:
  podSelector:
    matchLabels:
      app: scout
      version: v1
  port: http
  proxyProtocol: HTTP/1
  accessPolicy: deny
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: scout-v2-http
  namespace: starfleet
spec:
  podSelector:
    matchLabels:
      app: scout
      version: v2
  port: http
  proxyProtocol: HTTP/1
  accessPolicy: deny
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: scout-v2-allow-shuttle
  namespace: starfleet
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: scout-v2-http
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: shuttle
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scout-split
  namespace: starfleet
spec:
  parentRefs:
  - group: ''
    kind: Service
    name: scout
    port: 80
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: scout-v1
      port: 80
      weight: 80
    - group: ''
      kind: Service
      name: scout-v2
      port: 80
      weight: 20
