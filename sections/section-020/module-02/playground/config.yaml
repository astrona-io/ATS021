# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Require Mutual TLS And Authorize Callers With Linkerd (PLAYGROUND) —
# playground environment. A clean sandbox: it starts, installs Linkerd and the
# Starfleet workloads, then stays running for free exploration. No task, no
# grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# What the learner starts with: Linkerd edge-26.10.1 with the viz extension,
# `starfleet` with proxy injection and `scout`, `probe`, `shuttle`, and
# `outpost` without injection running `drifter`. The default inbound policy is
# all-unauthenticated and there is no Server or AuthorizationPolicy, on purpose.
bootstrap:
  init:
    - name: prepare
      description: "Install the linkerd CLI edge-26.10.1, Linkerd and its viz extension, then apply the Starfleet workloads"
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
