apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits
spec:
  rules:
  - name: require-cpu-memory-limits
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - starfleet
    validate:
      failureAction: Enforce
      message: Every container in starfleet must set resources.limits.cpu and resources.limits.memory.
      pattern:
        spec:
          containers:
          - resources:
              limits:
                cpu: ?*
                memory: ?*
