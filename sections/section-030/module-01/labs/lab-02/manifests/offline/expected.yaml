apiVersion: v1
kind: Pod
metadata:
  name: scout-default
  namespace: starfleet
  labels:
    team: unassigned
spec:
  serviceAccountName: scout
  containers:
  - name: scout
    image: ghcr.io/stefanprodan/podinfo:6.15.0
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
---
