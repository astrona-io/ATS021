apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-team-label
spec:
  rules:
  - name: add-default-team
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - starfleet
    mutate:
      patchStrategicMerge:
        metadata:
          labels:
            +(team): unassigned
