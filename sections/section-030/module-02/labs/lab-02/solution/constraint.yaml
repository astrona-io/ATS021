apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sStarfleetWorkloadRules
metadata:
  name: starfleet-workload-rules
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces: ["starfleet"]
  parameters:
    label: team
    minReplicas: 2
