# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Enforce Constraints With Gatekeeper And Rego (PLAYGROUND) — playground
# environment. A clean sandbox: it starts, installs Gatekeeper and the Starfleet
# workloads, then stays running for free exploration. No task, no grading, no
# `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# What the learner starts with: Gatekeeper 3.23.1, the Starfleet workloads
# (`drifter` uses the `latest` tag, `probe` has no `team` label) and one
# ConstraintTemplate whose Rego does not compile, all on purpose. No working
# ConstraintTemplate and no Constraint.
bootstrap:
  init:
    - name: prepare
      description: "Install Gatekeeper 3.23.1 from its release manifest, then apply the Starfleet workloads and the broken ConstraintTemplate"
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
