apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
