# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Write ValidatingAdmissionPolicies With CEL (PLAYGROUND) — playground
# environment. A clean sandbox: it starts, applies the Starfleet
# workloads, then stays running for free exploration. No task, no grading, no
# `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-playground-030-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# What the learner starts with: no policy engine (the API server does the
# work), `starfleet` labelled `environment: production` with `scout` at 8
# replicas, `outpost` labelled `environment: sandbox`, and a `replica-limits`
# ConfigMap to use as params. No ValidatingAdmissionPolicy.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
    - name: replica-limits
      type: file
      source: manifests/replica-limits.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
