# The Starfleet example app: scout and probe (backends) and shuttle (client)
# in `starfleet`, drifter (outside client) in `outpost`. Each workload has its
# own service account.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drifter
  namespace: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      serviceAccountName: scout
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      serviceAccountName: drifter
      containers:
        - name: drifter
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
# A background job that creates the activity to find in the audit log.
# Every two minutes the `deck-cleaner` CronJob in `outpost` runs as service
# account `deck-cleaner` and calls the API server with curl: it reads the
# Secret `scout-db-credentials` in `starfleet`, deletes the `probe`
# Deployment and creates it again from the copy in the `probe-manifest`
# ConfigMap. The Role below gives it exactly these rights in `starfleet`.
apiVersion: v1
kind: Secret
metadata:
  name: scout-db-credentials
  namespace: starfleet
type: Opaque
stringData:
  username: scout
  password: change-me-in-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deck-cleaner
  namespace: outpost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck-cleaner
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["scout-db-credentials"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck-cleaner
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck-cleaner
subjects:
  - kind: ServiceAccount
    name: deck-cleaner
    namespace: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-manifest
  namespace: outpost
data:
  probe.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: probe
      namespace: starfleet
      labels:
        app: probe
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: probe
      template:
        metadata:
          labels:
            app: probe
        spec:
          serviceAccountName: probe
          containers:
            - name: probe
              image: mccutchen/go-httpbin:2.25.0
              ports:
                - name: http
                  containerPort: 8080
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
  clean.sh: |
    #!/bin/sh
    API_URL=https://kubernetes.default.svc
    SERVICE_ACCOUNT_DIRECTORY=/var/run/secrets/kubernetes.io/serviceaccount
    API_TOKEN=$(cat "$SERVICE_ACCOUNT_DIRECTORY/token")
    call_api() {
      curl -sS -o /dev/null -w "%{http_code}\n" \
        --cacert "$SERVICE_ACCOUNT_DIRECTORY/ca.crt" \
        -H "Authorization: Bearer $API_TOKEN" "$@"
    }
    echo "read secret: $(call_api "$API_URL/api/v1/namespaces/starfleet/secrets/scout-db-credentials")"
    echo "delete probe: $(call_api -X DELETE "$API_URL/apis/apps/v1/namespaces/starfleet/deployments/probe")"
    sleep 5
    echo "create probe: $(call_api -X POST -H 'Content-Type: application/yaml' --data-binary @/job/probe.yaml "$API_URL/apis/apps/v1/namespaces/starfleet/deployments")"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deck-cleaner
  namespace: outpost
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: deck-cleaner
          restartPolicy: Never
          containers:
            - name: deck-cleaner
              image: curlimages/curl:8.22.0
              command: ["sh", "/job/clean.sh"]
              volumeMounts:
                - name: job
                  mountPath: /job
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
          volumes:
            - name: job
              configMap:
                name: probe-manifest
