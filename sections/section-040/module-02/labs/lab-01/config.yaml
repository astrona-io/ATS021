# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Produce Compliance Reports From Policy Engines (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-040-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: Kyverno 1.19.1 and Gatekeeper 3.23.1 with two Audit-mode
# ClusterPolicies and one dryrun Constraint, the Starfleet workloads with
# known violations, API server audit logging, and one scale of `relay` by the
# service account `fleet-ops`. The learner only reads the evidence and writes
# the answers.
bootstrap:
  init:
    - name: seed-cluster
      description: Install Kyverno and Gatekeeper, apply workloads and policies, turn on audit logging and scale relay
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution reads the live
# evidence and writes the answers.
testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: apply-solution
      description: Read the policy reports, the Constraint status and the audit log, then write the answers
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: kyverno-answers
      description: The answers for the two Kyverno policies list the Deployments in the reports that fail them
      type: file
      source: validation/validate-kyverno-answers.sh
      hint: Read the PolicyReports in all namespaces with kubectl get policyreport -A -o json and select the results with result fail. Each answer is a comma-separated list of namespace/name.
    - name: gatekeeper-answer
      description: The answer for the owner label lists the Deployments in the Constraint status
      type: file
      source: validation/validate-gatekeeper-answer.sh
      hint: Read status.violations of the Constraint deployments-need-owner. Use namespace/name.
    - name: audit-answers
      description: The answers name the identity that scaled relay in the audit log and the source that holds it
      type: file
      source: validation/validate-audit-answers.sh
      hint: Select the patch event for the scale subresource of relay in the audit log with jq and read user.username. The audit log is the source for who and when.
    - name: evidence-intact
      description: The policies, the Constraint, the workloads and audit logging are unchanged
      type: file
      source: validation/validate-evidence-intact.sh
      hint: Do not fix the violating workloads and do not change the enforcement of the policies. The task is to report what is wrong, not to repair it.

teardown:
  keepCluster: false
