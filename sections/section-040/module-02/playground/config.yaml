# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Produce Compliance Reports From Policy Engines (PLAYGROUND) — playground
# environment. A clean sandbox: it starts, installs Kyverno and Gatekeeper,
# applies the Starfleet workloads, two Audit-mode Kyverno policies and one
# dryrun Gatekeeper Constraint, turns on API server audit logging, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-021-playground-040-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# What the learner starts with: Kyverno 1.19.1 and Gatekeeper 3.23.1 with their
# webhooks ready, the Starfleet workloads, two Kyverno ClusterPolicies in Audit
# mode, one Gatekeeper ConstraintTemplate with a Constraint in dryrun mode, and
# API server audit logging with a short Metadata-level policy. `probe` has no
# limits and no `owner` label, and `legacy-beacon` uses the `latest` tag, on
# purpose.
bootstrap:
  init:
    - name: prepare
      description: "Install Kyverno 1.19.1 and Gatekeeper 3.23.1, apply the workloads and policies, then turn on audit logging on the control plane node"
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
