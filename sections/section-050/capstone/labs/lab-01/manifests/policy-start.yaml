# The fault: one policy for images. It only records failures (Audit), it does
# not check tags or digests, and it covers every namespace with an environment
# label, not only production.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trusted-images
spec:
  background: true
  rules:
    - name: only-ghcr
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: environment
                    operator: Exists
      validate:
        failureAction: Audit
        message: "Images must come from ghcr.io."
        pattern:
          spec:
            containers:
              - image: "ghcr.io/*"
