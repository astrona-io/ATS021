# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-capstone-050-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - aquasec/trivy:0.76.2
    - registry.k8s.io/kubectl:v1.35.8
    - reg.kyverno.io/kyverno/kyverno:v1.19.1
    - reg.kyverno.io/kyverno/kyvernopre:v1.19.1
    - reg.kyverno.io/kyverno/background-controller:v1.19.1
    - reg.kyverno.io/kyverno/reports-controller:v1.19.1
    - reg.kyverno.io/kyverno/cleanup-controller:v1.19.1
bootstrap:
  init:
  - name: install-tools
    description: Install Trivy 0.76.2 and jq 1.8.2 on the terminal
    type: file
    source: bootstrap/01-install-tools.sh
  - name: install-cosign
    type: file
    source: bootstrap/01-install-cosign.sh
  - name: install-kyverno
    type: file
    source: bootstrap/03-install-kyverno.sh
  - name: seed-pipeline
    type: file
    source: bootstrap/02-seed-pipeline.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: apply-solution
    type: file
    source: solution/apply.sh
  - name: wait-for-admission
    type: file
    source: testing/wait-for-admission.sh
validation:
  scripts:
  - name: vulnerability-gate
    description: Clean, blocked and failed releases prove scan gating, finally reporting and
      retained evidence
    type: file
    source: validation/validate-vulnerability-gate.sh
  - name: signature-evidence
    description: Recorded signed and unsigned references agree with live cosign verification
    type: file
    source: validation/validate-signature-evidence.sh
  - name: production-admission
    description: Production namespaces admit the signed image and reject the unsigned
      image
    type: file
    source: validation/validate-production-admission.sh
  - name: namespace-scope
    description: Development and unlabelled namespaces still admit both images
    type: file
    source: validation/validate-namespace-scope.sh
teardown:
  keepCluster: false
