apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-release
  namespace: pipelines
spec:
  description: Checks the release against the platform policies and writes pass or fail to a result.
  workspaces:
  - name: release
    readOnly: true
  - name: policies
    readOnly: true
  results:
  - name: outcome
    description: pass if the release follows every policy, fail if not
  steps:
  - name: validate
    image: ghcr.io/kyverno/kyverno-cli:v1.19.1
    onError: continue
    args:
    - apply
    - $(workspaces.policies.path)/policies.yaml
    - --resource
    - $(workspaces.release.path)/deployment.yaml
  - name: record-outcome
    image: curlimages/curl:8.22.0
    script: "#!/bin/sh\nif [ \"$(cat /tekton/steps/step-validate/exitCode)\" = \"0\" ]; then\n  printf\
      \ pass | tee $(results.outcome.path)\nelse\n  printf fail | tee $(results.outcome.path)\nfi\n"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-gate
  namespace: pipelines
spec:
  workspaces:
  - name: release
  - name: policies
  tasks:
  - name: check
    taskRef:
      name: check-release
    workspaces:
    - name: release
      workspace: release
    - name: policies
      workspace: policies
  - name: deploy
    runAfter:
    - check
    when:
    - input: $(tasks.check.results.outcome)
      operator: in
      values:
      - pass
    taskRef:
      name: deploy-release
    workspaces:
    - name: release
      workspace: release
