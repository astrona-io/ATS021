apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-gate
  namespace: pipelines
spec:
  workspaces:
  - name: release
  - name: policies
  tasks:
  - name: check
    taskRef:
      name: check-release
    workspaces:
    - name: release
      workspace: release
    - name: policies
      workspace: policies
  - name: deploy
    runAfter:
    - check
    when:
    - input: $(tasks.check.results.outcome)
      operator: in
      values:
      - pass
    taskRef:
      name: deploy-release
    workspaces:
    - name: release
      workspace: release
  finally:
  - name: report
    taskRef:
      name: report-outcome
    params:
    - name: pipeline-status
      value: $(tasks.status)
    - name: check-status
      value: $(tasks.check.status)
