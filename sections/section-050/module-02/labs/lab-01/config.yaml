# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-050-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - ghcr.io/stefanprodan/podinfo:6.15.0
bootstrap:
  init:
  - name: seed-cluster
    description: Install Kyverno 1.19.1, wait for its webhooks, then create the namespaces and the registry
      policy in Audit mode
    type: file
    source: bootstrap/01-seed-cluster.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: apply-solution
    description: Apply the reference solution for this task
    type: file
    source: solution/apply.sh
  - name: wait-for-solution
    type: file
    source: testing/wait-for-solution.sh
validation:
  scripts:
  - name: registry-enforced
    description: Images from a registry other than ghcr.io are rejected in namespaces with an environment
      label
    type: file
    source: validation/validate-registry-enforced.sh
    hint: The policy allowed-registries has failureAction Audit, which only records. Change it to Enforce.
      The pattern ghcr.io/* must stay anchored at the start of the image.
  - name: scope-and-labels-unchanged
    description: Namespace labels are unchanged and namespaces without an environment label are not affected
    type: file
    source: validation/validate-scope-and-labels-unchanged.sh
    hint: Select namespaces by their environment label. Do not relabel namespaces and do not match every
      namespace.
teardown:
  keepCluster: false
