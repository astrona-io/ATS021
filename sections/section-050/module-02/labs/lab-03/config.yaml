# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-050-02-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - ghcr.io/stefanprodan/podinfo:6.15.0
bootstrap:
  init:
  - name: seed-cluster
    description: Install Kyverno 1.19.1, wait for its webhooks, then create the namespaces and the registry
      policy in Audit mode
    type: file
    source: bootstrap/01-seed-cluster.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: apply-solution
    description: Apply the reference solution for this task
    type: file
    source: solution/apply.sh
  - name: wait-for-solution
    type: file
    source: testing/wait-for-solution.sh
validation:
  scripts:
  - name: mutable-tags-rejected
    description: The latest tag and a missing tag are rejected
    type: file
    source: validation/validate-mutable-tags-rejected.sh
    hint: Use two rules. The pattern *:* requires a colon in the image, and the pattern !*:latest refuses
      the latest tag.
  - name: digest-required-in-production
    description: starfleet-prod requires a digest and starfleet does not
    type: file
    source: validation/validate-digest-required-in-production.sh
    hint: Match the namespaceSelector matchLabels environment production and use the pattern *@sha256:*.
  - name: scope-and-labels-unchanged
    description: Namespace labels are unchanged and namespaces without an environment label are not affected
    type: file
    source: validation/validate-scope-and-labels-unchanged.sh
    hint: Select namespaces by their environment label. Do not relabel namespaces and do not match every
      namespace.
teardown:
  keepCluster: false
