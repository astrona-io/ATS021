# The fault: the registry rule exists but its failureAction is Audit.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allowed-registries
spec:
  background: true
  rules:
    - name: only-ghcr
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: environment
                    operator: Exists
      validate:
        failureAction: Audit
        message: "Images must come from ghcr.io."
        pattern:
          spec:
            containers:
              - image: "ghcr.io/*"
