# Two namespaces for the image policies: `starfleet` (development) and
# `starfleet-prod` (production). `scout` runs in `starfleet` with a tagged
# image. No image policy exists yet.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    environment: development
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-prod
  labels:
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      serviceAccountName: scout
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
