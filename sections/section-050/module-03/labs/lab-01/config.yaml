# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-021-lab-050-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
bootstrap:
  init:
  - name: install-tools
    description: Install Trivy 0.76.2 and jq 1.8.2 on the terminal
    type: file
    source: bootstrap/01-install-tools.sh
  - name: seed-workloads
    type: file
    source: bootstrap/02-seed-workloads.sh
testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
  - name: apply-solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: sbom-evidence
    description: CycloneDX inventory matches the live scout image
    type: file
    source: validation/validate-sbom-evidence.sh
    hint: Generate the SBOM for scout, with the node architecture, at the required
      absolute path.
  - name: package-version
    description: The recorded busybox version matches the live scout image
    type: file
    source: validation/validate-package-version.sh
    hint: Read the busybox component version in the scout SBOM, not the application
      tag.
  - name: package-owners
    description: The recorded bash owners match the live Deployment images
    type: file
    source: validation/validate-package-owners.sh
    hint: Generate an SBOM for each Deployment and inspect components named bash.
teardown:
  keepCluster: false
