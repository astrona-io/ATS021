# The Pipeline deploys any image; no scanning Task exists.
apiVersion: v1
kind: Namespace
metadata:
  name: pipelines
---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scan-runner
  namespace: pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-scout-scan
  namespace: starfleet
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - scout-scan
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-scout-scan
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-scout-scan
subjects:
- kind: ServiceAccount
  name: scan-runner
  namespace: pipelines
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: release-scan-evidence
  namespace: pipelines
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-scanned-release
  namespace: pipelines
spec:
  params:
  - name: image
    type: string
  steps:
  - name: deploy
    image: registry.k8s.io/kubectl:v1.35.8
    command:
    - kubectl
    args:
    - -n
    - starfleet
    - set
    - image
    - deployment/scout-scan
    - scout=$(params.image)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-scan-reader
  namespace: pipelines
---
apiVersion: v1
kind: Pod
metadata:
  name: release-scan-reader
  namespace: pipelines
spec:
  serviceAccountName: release-scan-reader
  containers:
  - name: reader
    image: docker.io/library/alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep infinity
    volumeMounts:
    - name: evidence
      mountPath: /evidence
      readOnly: true
  volumes:
  - name: evidence
    persistentVolumeClaim:
      claimName: release-scan-evidence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout-scan
  namespace: starfleet
spec:
  replicas: 0
  selector:
    matchLabels:
      app: scout-scan
  template:
    metadata:
      labels:
        app: scout-scan
    spec:
      containers:
      - name: scout
        image: docker.io/library/alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-release-images
  namespace: pipelines
data:
  clean: docker.io/library/hello-world@sha256:5e22040d441e5fb3aed38368acbe8486b575d7018df38dbdfbc7311fbb2ef3a9
  vulnerable: docker.io/library/alpine@sha256:c19173c5ada610a5989151111163d28a67368362762534d8a8121ce95cf2bd5a
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-scan-gate
  namespace: pipelines
spec:
  params:
  - name: image
    type: string
  - name: platform
    type: string
  workspaces:
  - name: evidence
  tasks:
  - name: deploy
    taskRef:
      name: deploy-scanned-release
    params:
    - name: image
      value: $(params.image)
