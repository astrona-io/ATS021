apiVersion: astrona.io/v1
metadata:
  name: ats-021-playground-050-03
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - aquasec/trivy:0.76.2
    - registry.k8s.io/kubectl:v1.35.8
bootstrap:
  init:
  - name: prepare
    description: Install scanning and signing tools, Tekton and Kyverno; seed workloads
      and evidence storage
    type: file
    source: bootstrap/prepare.sh
teardown:
  keepCluster: false
