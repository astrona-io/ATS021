apiVersion: v1
kind: Namespace
metadata:
  name: pipelines
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: update-scout
  namespace: starfleet
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [scout]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: update-scout
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: update-scout
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: pipelines
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sbom-evidence
  namespace: pipelines
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-inventory
  namespace: pipelines
spec:
  params:
    - name: image
      type: string
  steps:
    - name: deploy
      image: registry.k8s.io/kubectl:v1.35.8
      command: [kubectl]
      args: [-n, starfleet, set, image, deployment/scout, 'scout=$(params.image)']
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evidence-reader
  namespace: pipelines
---
apiVersion: v1
kind: Pod
metadata:
  name: evidence-reader
  namespace: pipelines
spec:
  serviceAccountName: evidence-reader
  containers:
    - name: reader
      image: docker.io/library/alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
      imagePullPolicy: IfNotPresent
      command: [sh, -c, sleep infinity]
      volumeMounts:
        - name: evidence
          mountPath: /evidence
          readOnly: true
  volumes:
    - name: evidence
      persistentVolumeClaim:
        claimName: sbom-evidence
